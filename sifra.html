<!DOCTYPE html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kopiraj šifru</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #102033;
    }
    main {
      max-width: 36rem;
      margin: 0 auto;
      padding: 1.5rem;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      background: #0b3a6a;
      color: #fff;
      padding: 1.5rem 1rem;
      font: inherit;
      font-size: 1.25rem;
      cursor: pointer;
    }
    button.done {
      background: #146c43;
    }
    code {
      display: block;
      margin-top: 0.75rem;
      font-size: 1.35rem;
      word-break: break-all;
    }
    a {
      display: inline-block;
      margin-top: 1.25rem;
      color: #0b3a6a;
    }
  </style>
</head>
<body>
  <main>
    <button id="copy" type="button">
      <span id="label">Dodirni za kopiranje šifre</span>
      <code id="value"></code>
    </button>
    <a href="https://selekcija.gov.hr/natjecaji/objavljeni-natjecaji">Otvori popis natječaja</a>
  </main>
  <script>
    const code = new URLSearchParams(location.search).get("sifra") || "";
    const value = document.getElementById("value");
    const label = document.getElementById("label");
    const button = document.getElementById("copy");
    value.textContent = code || "Šifra nije prenesena.";

    async function copyCode() {
      if (!code) {
        return;
      }
      let copied = false;
      try {
        await navigator.clipboard.writeText(code);
        copied = true;
      } catch (error) {
        const area = document.createElement("textarea");
        area.value = code;
        document.body.appendChild(area);
        area.select();
        copied = document.execCommand("copy");
        area.remove();
      }
      if (copied) {
        button.className = "done";
        label.textContent = "Šifra je kopirana. Zalijepi je u tražilicu.";
      } else {
        const range = document.createRange();
        range.selectNodeContents(value);
        const selection = window.getSelection();
        selection.removeAllRanges();
        selection.addRange(range);
        label.textContent = "Označi šifru i kopiraj je ručno.";
      }
    }

    button.addEventListener("click", copyCode);
  </script>
</body>
</html>
